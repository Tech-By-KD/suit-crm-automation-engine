[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-automation-framework"
version = "0.1.0"
description = "Playwright + Pytest UI automation framework for a CRM (SuiteCRM 8 demo)"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.48",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
